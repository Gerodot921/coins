<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>GIFT COIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000;--bg2:#0a0a0a;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.14);--border2:rgba(255,255,255,.08);
  --txt:#fff;--mut:#8e8e93;--blur:40px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;background:transparent}
html,body{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,255,255,.07),transparent),
    radial-gradient(circle at 15% 85%,rgba(255,255,255,.03),transparent 40%),
    radial-gradient(circle at 85% 70%,rgba(255,255,255,.04),transparent 35%),
    linear-gradient(180deg,#000 0%,#050505 50%,#000 100%);
  height:100%;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
.ic.f{fill:currentColor;stroke:none}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}

/* liquid glass base */
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 40%,rgba(255,255,255,.08) 100%);
  backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 32px rgba(0,0,0,.45);
  position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 35%,rgba(255,255,255,.06) 60%,transparent 80%);
  opacity:.45}
.glass::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  opacity:.35;mix-blend-mode:overlay}

.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none;z-index:2}
.hd.glass{border-radius:0;border-left:0;border-right:0;border-top:0}
.hd .ttl{flex:1;text-align:center;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.hd .side{width:36px;height:36px;display:grid;place-items:center;color:var(--mut);flex:none;z-index:1}
.hd .ava{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;
  backdrop-filter:blur(20px);border:1px solid var(--border2);overflow:hidden}
.hd .back{cursor:pointer}
.ava-img{width:100%;height:100%;object-fit:cover;border-radius:50%}

.sc{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 100px;-webkit-overflow-scrolling:touch;z-index:1;scrollbar-width:none;-ms-overflow-style:none}
.sc::-webkit-scrollbar{width:0;height:0;background:transparent}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;
  display:flex;justify-content:space-around;padding:6px 2px calc(8px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;border-bottom:0}
.nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9px;letter-spacing:.2px;width:19%;cursor:pointer;padding:6px 0;position:relative;z-index:1}
.nav button .gi{font-size:20px;line-height:1}
.nav button.on{color:var(--txt)}
.nav button.on .gi{filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}

.card{border-radius:18px;margin-bottom:10px;position:relative;z-index:1}
.card.pad{padding:14px}
.row{display:flex;align-items:center;gap:11px;padding:12px 13px}
.row .bx{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;
  color:var(--mut);font-size:16px;flex:none;border:1px solid var(--border2);backdrop-filter:blur(16px)}
.row .t{flex:1;min-width:0}
.row .t b{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{font-size:10px;color:var(--mut);margin-top:2px;display:block}
.btnw{background:#fff;color:#000;border:0;border-radius:12px;padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(255,255,255,.15)}
.btnd{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--border2);border-radius:12px;
  padding:7px 16px;font-size:11px;font-weight:600;cursor:pointer;backdrop-filter:blur(12px)}
.btnw:active,.btnd:active,.nav button:active,.pill:active,.coin:active{transform:scale(.96)}
.pill{font-size:10px;padding:6px 14px;border-radius:999px;border:1px solid var(--border2);
  background:rgba(255,255,255,.06);color:var(--mut);cursor:pointer;backdrop-filter:blur(12px);white-space:nowrap}
.pill.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin:2px 0 12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{height:0}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s ease}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.two .card{padding:12px;text-align:center}
.two small{font-size:9px;color:var(--mut);display:block;margin-bottom:3px;letter-spacing:.5px}
.two b{font-size:16px;font-weight:700}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.three .card{padding:10px 6px;text-align:center;font-size:10px}
.three b{font-size:14px;display:block;margin-top:2px}

/* coin tap */
.bal{text-align:center;margin-top:4px}
.bal .v{font-size:32px;font-weight:800;letter-spacing:-.5px}
.bal .u{font-size:10px;letter-spacing:5px;color:var(--mut);margin-top:2px}
.bal .pt{font-size:12px;color:var(--mut);margin-top:4px}
.coinwrap{position:relative;display:grid;place-items:center;margin:18px 0;user-select:none}
.coin{width:168px;height:168px;border-radius:50%;display:grid;place-items:center;font-size:58px;
  background:radial-gradient(circle at 38% 32%,#555 0%,#222 42%,#000 100%);
  border:2px solid rgba(255,255,255,.25);cursor:pointer;position:relative;z-index:2;
  box-shadow:0 20px 50px rgba(0,0,0,.8),inset 0 2px 12px rgba(255,255,255,.25),inset 0 -10px 24px rgba(0,0,0,.6)}
.coinwrap.flash::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.5) 0%,transparent 70%);filter:blur(20px);
  opacity:0;animation:flash .2s ease-out forwards;pointer-events:none}
.coin.pop{animation:pop .15s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0;transform:scale(.8)}50%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.float{position:absolute;z-index:5;font-weight:800;font-size:18px;pointer-events:none;
  animation:fu .75s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes fu{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}

/* wheel */
.wheel-box{display:grid;place-items:center;margin:16px 0}
.wheel{width:220px;height:220px;border-radius:50%;position:relative;border:3px solid rgba(255,255,255,.2);
  box-shadow:0 0 40px rgba(255,255,255,.08);transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.wheel.spinning{pointer-events:none}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #fff;z-index:3;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

/* case cards */
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.case-item{border-radius:18px;padding:14px 12px;text-align:center;cursor:pointer}
.case-item .ico{font-size:32px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;height:110px}
.case-item .ico img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.case-item b{font-size:12px;display:block;margin-bottom:4px}
.case-item small{font-size:10px;color:var(--mut)}

/* vault grid */
.vault-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vault-item{border-radius:14px;padding:12px 8px;text-align:center;font-size:10px}
.vault-item .prize-ico{font-size:24px;margin-bottom:4px}

/* quiz */
.quiz-q{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.4}
.quiz-opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);color:var(--txt);font-size:13px;cursor:pointer}
.quiz-opt.correct{border-color:#fff;background:rgba(255,255,255,.15)}
.quiz-opt.wrong{opacity:.4}

/* clan */
.clan-banner{border-radius:18px;padding:20px;text-align:center;margin-bottom:12px}
.clan-logo{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;
  font-size:24px;margin:0 auto 10px;border:1px solid var(--border)}

/* subscription */
.sub-hero{border-radius:20px;padding:24px 18px;text-align:center;margin-bottom:14px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}
.sub-hero h3{font-size:18px;font-weight:700;margin-bottom:6px}
.sub-hero p{font-size:11px;color:var(--mut);line-height:1.5}
.sub-feat{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2)}
.sub-feat:last-child{border:0}
.sub-feat .ck{color:#fff;font-size:14px;margin-top:1px}
.sub-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(12px);border:1px solid var(--border2);z-index:3}
.sub-arrow.left{left:10px}
.sub-arrow.right{right:10px}
.sub-arrow.right .ic{transform:rotate(180deg)}
.sub-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.sub-dots .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25)}
.sub-dots .dot.on{background:#fff;width:16px;border-radius:3px}

/* subscription badge on avatar */
.ava-wrap{position:relative;width:100%;height:100%;display:block}
.sub-badge{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;
  border:2px solid #000;z-index:2}
.sub-badge.pro{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.7)}
.sub-badge.elite{background:#facc15;box-shadow:0 0 6px rgba(250,204,21,.7)}

/* ambient particles while a subscription is active */
.sub-particles{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  height:100dvh;pointer-events:none;overflow:hidden;z-index:5}
.sub-particle{position:absolute;bottom:-24px;border-radius:50%;opacity:0;
  animation:subParticleUp linear forwards}
@keyframes subParticleUp{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:1}
  80%{opacity:.7}
  100%{opacity:0;transform:translateY(-108vh) scale(1)}
}

/* vip badges */
.vip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}
.vip-badge{flex:none;padding:8px 14px;border-radius:12px;font-size:10px;font-weight:600;
  border:1px solid var(--border2);background:rgba(255,255,255,.05);color:var(--mut)}
.vip-badge.active{background:#fff;color:#000;border-color:#fff}

/* leaderboard */
.rk{width:22px;text-align:center;color:var(--mut);font-size:11px;font-weight:600}
.me{border-color:rgba(255,255,255,.5)!important;background:rgba(255,255,255,.1)!important}

/* section title */
.sec{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin:14px 2px 8px}

/* upgrader */
.upgrade-zone{border-radius:20px;padding:24px;text-align:center;margin-bottom:12px;min-height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.upgrade-zone .slot{width:72px;height:72px;border-radius:18px;border:2px dashed var(--border);
  display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.04)}
.upgrade-arrows{font-size:20px;color:var(--mut);letter-spacing:8px}

.full{width:100%;border:0;border-radius:14px;padding:13px;font-size:13px;font-weight:600;margin-top:8px;cursor:pointer}
.full.w{background:#fff;color:#000}
.full.g{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--border2)}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);
  background:rgba(255,255,255,.95);color:#000;padding:10px 18px;border-radius:22px;font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:85%;text-align:center;
  backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.load{display:grid;place-items:center;height:100%;color:var(--mut);font-size:13px;padding:30px;text-align:center;line-height:1.6}
.menu .row{cursor:pointer}
.empty{text-align:center;padding:32px 20px;color:var(--mut);font-size:12px;line-height:1.6}
.badge{font-size:9px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--mut);
  border:1px solid var(--border2)}
.badge.hot{background:#fff;color:#000;font-weight:700}
.energy-pop{max-height:0;overflow:hidden;opacity:0;
  transition:max-height .22s ease,opacity .18s ease}
.energy-pop.open{max-height:60px;opacity:1}
.energy-pop-in{background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:14px;
  padding:10px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.energy-pop-in small{color:var(--mut);font-size:10px}
.energy-pop-in b{font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
</style>
</head>

<div id="app"><div class="load">Загрузка…</div></div>
<div id="toast"></div>

<script>
/* ============================================================
   GIFT COIN — Telegram Mini App (single file, no build step)
   Deploy this file as-is to Vercel (Static / "Other" preset).
   ============================================================ */

/* >>> Backend URL — override at runtime with ?api=https://... for testing. */
const API_BASE = (new URLSearchParams(location.search).get('api'))
  || (location.protocol === 'file:' ? 'http://localhost:3001' : 'https://api.richmachine.ru');
const TG = window.Telegram && window.Telegram.WebApp;
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Math.floor(n).toLocaleString('ru-RU');
const I = id => `<svg class="ic"><use href="#${id}"/></svg>`;

function tgUser() {
  try { return (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || null; }
  catch { return null; }
}
function avatarHtml(size) {
  const u = tgUser();
  const cls = size === 'lg' ? 'avatar-lg' : '';
  const fallback = I('i-user').replace(/"/g, '&quot;');
  // photo_url from Telegram initData is unreliable (often absent), so we try it first
  // as a fast path, then fall back to our backend, which fetches the real photo via
  // the Bot API (getUserProfilePhotos/getFile) — that's the only reliable source.
  const directPhoto = u && u.photo_url;
  const id = (u && u.id) || (state.user && state.user.id);
  const proxyUrl = id ? `${API_BASE}/avatar/${encodeURIComponent(id)}` : '';
  const src = directPhoto || proxyUrl;
  if (!src) return I('i-user');
  const onerr = directPhoto && proxyUrl
    ? `if(this.dataset.retried!=='1'){this.dataset.retried='1';this.src='${proxyUrl}';}else{this.outerHTML='${fallback}';}`
    : `this.outerHTML='${fallback}';`;
  return `<img class="ava-img ${cls}" src="${src}" alt="avatar" referrerpolicy="no-referrer" onerror="${onerr}"/>`;
}

const CASES = [
  { id:'basic', name:'Базовый', price:500000, emoji:'📦', desc:'Обычный кейс' },
  { id:'premium', name:'Премиум', price:2500000, emoji:'🎁', desc:'Улучшенный кейс' },
  { id:'legend', name:'Легендарный', price:10000000, emoji:'👑', desc:'Редкий кейс' },
];

/* Subscriptions: buying one grants a fixed pool of clicks that replace normal
   energy for the duration. Each click = +1 Gift Coin, and every 50th click
   rolls a 0.05% chance at a bonus gift (up to maxGift stars). */
const SUBSCRIPTIONS = [
  {
    id:'pro', name:'GIFT COIN PRO', short:'PRO', color:'#22c55e',
    price:0, clicks:5000, maxGift:500,
    desc:'Больше бонусов · 5 000 кликов · VIP-задания',
    features:[
      'Пул из 5 000 кликов, +1 коин за клик',
      'Шанс на подарок каждый 50-й клик',
      'Максимальный подарок — 500 ⭐️',
      'VIP-задания с высокой оплатой',
      'Приоритет в очереди на вывод',
    ],
  },
  {
    id:'elite', name:'GIFT COIN ELITE', short:'ELITE', color:'#facc15',
    price:0, clicks:10000, maxGift:1000,
    desc:'Максимум бонусов · 10 000 кликов · эксклюзивные задания',
    features:[
      'Пул из 10 000 кликов, +1 коин за клик',
      'Повышенный шанс на подарок каждый 50-й клик',
      'Максимальный подарок — 1 000 ⭐️',
      'Эксклюзивные VIP-задания',
      'Мгновенный вывод без очереди',
    ],
  },
];
function subCfg(id) { return SUBSCRIPTIONS.find(s=>s.id===id); }
function activeSub() { return state.local && state.local.subscription; }
function subBadgeHtml() {
  const sub = activeSub();
  if (!sub) return '';
  return `<span class="sub-badge ${sub.id}"></span>`;
}
function avaWithBadge(size) {
  return `<div class="ava-wrap">${avatarHtml(size)}${subBadgeHtml()}</div>`;
}

const QUIZ = [
  { q:'Какой блокчейн использует GIFT COIN?', opts:['Ethereum','TON','Solana','Bitcoin'], a:1 },
  { q:'Что такое Telegram Stars?', opts:['Криптовалюта','Внутренняя валюта Telegram','NFT','Стейблкоин'], a:1 },
  { q:'Сколько уровней реферальной системы?', opts:['1','2','3','5'], a:2 },
];

const ROOTS = ['earn','games','cases','tasks','profile'];

const state = {
  user: null, screen: 'earn', tab: 'earn',
  tasksTab: 'daily', casesTab: 'shop', gamesTab: 'hub',
  lbTab: 'daily', friends: [],
  local: loadLocal(),
  quizIdx: 0, quizScore: 0,
  upgradeSlot: null, wheelAngle: 0, wheelSpinning: false,
};

function loadLocal() {
  try { return JSON.parse(localStorage.getItem('gc_local') || '{}'); }
  catch { return {}; }
}
function saveLocal() { localStorage.setItem('gc_local', JSON.stringify(state.local)); }
function ensureLocal() {
  const d = state.local;
  if (!d.vault) d.vault = [{ name:'50 Stars', emoji:'⭐' }];
  if (!d.wheelLast) d.wheelLast = 0;
  if (!d.achievements) d.achievements = { taps:0, cases:0, refs:0 };
  if (d.subscription === undefined || d.subscription === true || d.subscription === false) d.subscription = null;
  if (!d.clan) d.clan = null;
  if (d.totalTaps === undefined) d.totalTaps = 0;
  saveLocal();
}

function tgReady() {
  if (!TG) return;
  try { TG.ready(); TG.expand(); TG.setBackgroundColor('#000000'); TG.setHeaderColor('#000000'); } catch(e){}
}
function haptic(k='light') {
  const h = TG && TG.HapticFeedback; if (!h) return;
  try { k==='success'||k==='error'||k==='warning' ? h.notificationOccurred(k) : h.impactOccurred(k); } catch(e){}
}

const TOKEN_KEY = 'gc_token';
function token() { return localStorage.getItem(TOKEN_KEY); }
async function api(path, body) {
  const headers = { 'Content-Type':'application/json' };
  const t = token(); if (t) headers['Authorization'] = 'Bearer '+t;
  const res = await fetch(API_BASE + path, {
    method: body===undefined ? 'GET' : 'POST', headers,
    body: body===undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) { const e = new Error(data.error||('HTTP '+res.status)); e.status = res.status; throw e; }
  return data;
}
function getInitData() {
  if (TG && TG.initData) return TG.initData;
  try {
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
    return decodeURIComponent(new URLSearchParams(hash).get('tgWebAppData')||'');
  } catch { return ''; }
}
async function auth() {
  const r = await api('/auth', { initData: getInitData() });
  localStorage.setItem(TOKEN_KEY, r.token);
  return r.user;
}
async function ensureAuth() {
  if (token()) { try { return (await api('/me')).user; } catch(e) { if (e.status!==401) throw e; } }
  return await auth();
}
function demoUser() {
  const maxEnergy = 100000;
  return { id:'demo', username:'player', balance:1250000, energy:Math.floor(maxEnergy*0.7), maxEnergy, tapPower:3,
    level:5, rank:'Silver', rankCurrent:250000, rankNext:900000,
    boosts:{}, tasksClaimed:[], airdropDone:[], friendsCount:7, friendsEarned:700000,
    lastLoginTs:0, extraRewardPct:0, regenPerSec:maxEnergy/86400, lastEnergyTs:Date.now() };
}

let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2000);
}

function go(screen) {
  if (ROOTS.includes(screen)) state.tab = screen;
  state.screen = screen;
  if (screen==='profile' || screen==='friends') {
    api('/friends').then(r=>{ state.friends=r.list; render(); }).catch(()=>{});
  }
  render();
}
function back() { go(state.tab||'earn'); }

function header(title, mode) {
  // mode: true/'back' = back button, 'none' = no icon (used on the Profile screen itself,
  // since that screen already shows the avatar in its body), otherwise = avatar icon.
  let left;
  if (mode === true || mode === 'back') {
    left = `<div class="side back" style="border-radius:12px;width:36px;height:36px" data-act="back">${I('i-back')}</div>`;
  } else if (mode === 'none') {
    left = `<div class="side"></div>`;
  } else {
    left = `<div class="ava" data-act="go" data-to="profile" style="overflow:visible">${avaWithBadge()}</div>`;
  }
  return `<div class="hd">${left}<div class="ttl">${title}</div><div class="side"></div></div>`;
}

function nav() {
  const items = [
    ['earn','Тап','i-gift'],['games','Игры','i-game'],['cases','Кейсы','i-box'],
    ['tasks','Задания','i-clip'],['profile','Профиль','i-user'],
  ];
  return `<nav class="nav glass">${items.map(([id,lbl,ic])=>
    `<button class="${state.screen===id||(['shop','subscription','boost','friends','clans','leaderboard','vault','upgrader','wheel','quiz','stats','achievements','staking'].includes(state.screen)&&id==='profile')||(state.screen==='vault'&&id==='cases')||( ['upgrader','wheel','quiz','leaderboard'].includes(state.screen)&&id==='games') ? 'on':''}" data-act="go" data-to="${id}">
      <span class="gi">${I(ic)}</span><span>${lbl}</span></button>`).join('')}</nav>`;
}

function screenEarn() {
  const u = state.user;
  const sub = activeSub();
  const scfg = sub && subCfg(sub.id);
  const pct = sub ? Math.round((sub.clicksLeft/scfg.clicks)*100) : Math.round((u.energy/u.maxEnergy)*100);
  return header('GIFT COIN', false) + `<div class="sub-particles" id="subParticles"></div><div class="sc">
    ${sub ? `<div class="card glass pad" style="padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px">
      <span style="color:${scfg.color}">${I('i-crown')}</span><span style="font-size:11px">${scfg.name} · +1 коин за клик</span></div>` : ''}
    <div class="bal">
      <div class="v num" id="bal">${fmt(u.balance)}</div>
      <div class="u">GIFT COIN</div>
      <div class="pt">${sub ? '+1 за тап · подписка '+scfg.short : '+'+u.tapPower+' за тап'}</div>
    </div>
    <div class="coinwrap" id="coinwrap">
      <div class="coin glass" id="coin">${I('i-gift')}</div>
    </div>
    <div class="card glass pad" data-act="energy-info" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:6px">
        <span>${I('i-zap')} ${sub?'Клики подписки':'Энергия'}</span>
        <span class="num" id="entxt">${sub ? fmt(sub.clicksLeft)+' / '+fmt(scfg.clicks) : fmt(u.energy)+' / '+fmt(u.maxEnergy)}</span>
      </div>
      <div class="bar"><i id="enbar" style="width:${pct}%"></i></div>
    </div>
    ${!sub ? `<div class="energy-pop" id="energyPop">
      <div class="energy-pop-in">
        <small>Полное восстановление через</small>
        <b id="energyTimer">--:--:--</b>
      </div>
    </div>` : ''}
    <div class="two" style="margin-top:10px">
      <div class="card glass" data-act="go" data-to="daily"><small>Ежедневная</small><b>${I('i-star')}</b></div>
      <div class="card glass" data-act="go" data-to="leaderboard"><small>Рейтинг</small><b>${I('i-trophy')}</b></div>
    </div>
  </div>`;
}

function screenGames() {
  if (state.screen==='upgrader') return screenUpgrader();
  if (state.screen==='wheel') return screenWheel();
  if (state.screen==='quiz') return screenQuiz();
  if (state.screen==='leaderboard') return screenLeaderboard();
  return header('ИГРЫ', false) + `<div class="sc">
    <div class="sec">Мини-игры</div>
    ${[
      ['upgrader','i-up','Апгрейдер','Улучши приз или потеряй','50/50'],
      ['wheel','i-wheel','Колесо фортуны','Бесплатно раз в 24ч','Spin'],
      ['quiz','i-quiz','Викторина','Вопросы про крипто','+награда'],
      ['leaderboard','i-trophy','Лидерборд','Топ таперов и рефералов','TOP'],
    ].map(([to,ic,t,d,badge])=>`<div class="card glass row menu" data-act="go" data-to="${to}">
      <div class="bx">${I(ic)}</div><div class="t"><b>${t}</b><small>${d}</small></div>
      <span class="badge ${badge==='50/50'?'hot':''}">${badge}</span></div>`).join('')}
    <div class="sec">Клановые войны</div>
    <div class="card glass pad">
      <p style="font-size:12px;line-height:1.5;color:var(--mut)">Соревнование между кланами — кто больше прокликает за 24–48 часов. Победители получают x2 коины и эксклюзивные призы.</p>
      <button class="full g" data-act="go" data-to="clans">Перейти к кланам</button>
    </div>
  </div>`;
}

function screenUpgrader() {
  const cost = 50000;
  return header('АПГРЕЙДЕР', true) + `<div class="sc">
    <div class="card glass upgrade-zone">
      <div class="slot">${I('i-gift')}</div>
      <div class="mut" style="font-size:11px">Поставь ${fmt(cost)} коинов</div>
      <div class="upgrade-arrows">↑ ↑ ↑</div>
      <div style="font-size:11px;color:var(--mut)">50% удвоение · 50% потеря ставки</div>
    </div>
    <button class="full w" data-act="do-upgrade">Апгрейд · ${fmt(cost)}</button>
    <div class="sec">Правила</div>
    <div class="card glass pad" style="font-size:11px;color:var(--mut);line-height:1.6">
      Ставь коины на удвоение. При успехе — ставка удваивается. При провале — ставка теряется. Можно играть несколько раз подряд.
    </div>
  </div>`;
}

function screenWheel() {
  const last = state.local.wheelLast||0;
  const free = Date.now()-last > 86400000;
  const segs = ['100K','⭐','500K','💎','50K','👑','200K','🎁'];
  const colors = segs.map((_,i)=> i%2?'#1a1a1a':'#2a2a2a');
  let gradient = segs.map((_,i)=>`${colors[i]} ${i*(360/segs.length)}deg ${(i+1)*(360/segs.length)}deg`).join(',');
  return header('КОЛЕСО', true) + `<div class="sc">
    <div class="wheel-box">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel" style="background:conic-gradient(${gradient});transform:rotate(${state.wheelAngle}deg)">
        <div style="position:absolute;inset:30%;border-radius:50%;background:#000;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:11px;font-weight:700">SPIN</div>
      </div>
    </div>
    <button class="full w" data-act="spin-wheel" ${!free&&!state.wheelSpinning?'':''} ${!free?'disabled style="opacity:.5"':''}>
      ${free ? 'Крутить бесплатно' : 'Следующий спин через '+Math.ceil((86400000-(Date.now()-last))/3600000)+'ч'}
    </button>
    <button class="full g" data-act="spin-wheel-paid">Крутить за 100,000</button>
  </div>`;
}

function screenQuiz() {
  const q = QUIZ[state.quizIdx];
  if (!q) return header('ВИКТОРИНА', true) + `<div class="sc">
    <div class="card glass pad" style="text-align:center;padding:30px">
      <div style="font-size:40px;margin-bottom:12px">${I('i-trophy')}</div>
      <b style="font-size:16px">Результат: ${state.quizScore}/${QUIZ.length}</b>

      <button class="full w" data-act="quiz-restart">Играть снова</button>
    </div></div>`;
  return header('ВИКТОРИНА', true) + `<div class="sc">
    <div class="card glass pad">
      <div class="mut" style="font-size:10px;margin-bottom:8px">Вопрос ${state.quizIdx+1}/${QUIZ.length}</div>
      <div class="quiz-q">${q.q}</div>

    </div>
  </div>`;
}

function screenLeaderboard() {
  return header('РЕЙТИНГ', true) + `<div class="sc">
    <div class="tabs">
      ${['daily','weekly','monthly','refs'].map(t=>
        `<span class="pill ${state.lbTab===t?'on':''}" data-act="ltab" data-v="${t}">${
          {daily:'День',weekly:'Неделя',monthly:'Месяц',refs:'Рефералы'}[t]}</span>`).join('')}
    </div>
    <div id="lbrows"><div class="mut" style="text-align:center;padding:20px">Загрузка…</div></div>
  </div>`;
}

function screenCases() {

  return header('КЕЙСЫ', false) + `<div class="sc">
    <div class="tabs">
      <span class="pill ${tab==='shop'?'on':''}" data-act="ctab" data-v="shop">Магазин</span>
      <span class="pill ${tab==='vault'?'on':''}" data-act="go" data-to="vault">Хранилище (${state.local.vault.length})</span>
    </div>
    ${tab==='shop' ? `
    <div class="case-grid">
      ${CASES.map(c=>`<div class="case-item glass" data-act="open-case" data-id="${c.id}">
        <div class="ico">${c.img?`<img src="${c.img}" alt="${c.name}"/>`:c.emoji}</div><b>${c.name}</b><small>${fmt(c.price)} · ${c.desc}</small></div>`).join('')}
    </div>
    <div class="sec">Как работают кейсы</div>
    <div class="card glass pad" style="font-size:11px;color:var(--mut);line-height:1.6">
      Покупай кейс за коины → получай случайный приз. Непонравившиеся можно отложить в хранилище или апгрейдить.

  </div>`;
}

function screenVault() {
  const v = state.local.vault;
  return header('ХРАНИЛИЩЕ', true) + `<div class="sc">
    ${v.length ? `<div class="vault-grid">
      ${v.map((p,i)=>`<div class="vault-item glass" data-act="vault-item" data-i="${i}">

    <div class="sec">Действия</div>

    </div>
  </div>`;
}

function screenTasks() {
  const u = state.user;
  const today = new Date().toDateString();
  const tab = state.tasksTab;
  const dailyTasks = [
    { id:'daily_login', title:'Ежедневный вход', reward:100000, kind:'daily', action:'claim' },
    { id:'tap_1000', title:'Натапай 1000 раз', reward:50000, kind:'daily', action:'progress', meta:`${Math.min(1000,state.local.totalTaps)}/1000` },
    { id:'daily_reward', title:'Собери ежедневную награду', reward:75000, kind:'daily', action:'claim' },
  ];
  const projectTasks = [
    { id:'join_tg', title:'Подпишись на канал проекта', reward:50000, kind:'once', action:'link', meta:'t.me/' },
    { id:'follow_x', title:'Подпишись в X', reward:50000, kind:'once', action:'link', meta:'x.com/' },
  ];
  const adTasks = [
    { id:'watch_video', title:'Посмотри рекламное видео', reward:30000, kind:'once', action:'video' },
    { id:'partner_app', title:'Установи партнёрское приложение', reward:150000, kind:'once', action:'link', meta:'#' },
    { id:'survey', title:'Пройди опрос рекламодателя', reward:80000, kind:'once', action:'claim' },
  ];
  const list = tab==='daily' ? dailyTasks : tab==='project' ? projectTasks : adTasks;
  const right = t => {
    const claimed = t.kind==='once' && u.tasksClaimed.includes(t.id);
    const dailyDone = t.kind==='daily' && t.id==='daily_login' && new Date(u.lastLoginTs).toDateString()===today;
    if (claimed||dailyDone) return `<span>${I('i-check')}</span>`;
    if (t.action==='claim') return `<button class="btnw" data-act="claim" data-id="${t.id}">Забрать</button>`;
    if (t.action==='link') return `<button class="btnw" data-act="claim" data-id="${t.id}" data-link="${t.meta}">Go</button>`;
    if (t.action==='video') return `<button class="btnd" data-act="claim" data-id="${t.id}">Смотреть</button>`;

  };
  return header('ЗАДАНИЯ', false) + `<div class="sc">
    <div class="tabs">
      <span class="pill ${tab==='daily'?'on':''}" data-act="ttab" data-v="daily">Ежедневные</span>

function screenAchievements() {
  const a = state.local.achievements;
  const items = [
    { id:'taps', title:'1000 тапов', cur:a.taps, max:1000, reward:100000 },
    { id:'cases', title:'10 кейсов', cur:a.cases, max:10, reward:500000 },
    { id:'refs', title:'10 рефералов', cur:a.refs, max:10, reward:1000000 },
    { id:'clan', title:'Вступи в клан', cur:state.local.clan?1:0, max:1, reward:200000 },
  ];
  return header('ДОСТИЖЕНИЯ', true) + `<div class="sc">
    ${items.map(it=>{

let subParticleTimer = null;
function startSubParticles(color) {
  stopSubParticles();
  const container = $('#subParticles');
  if (!container) return;
  const spawn = () => {
    const el = document.createElement('span');
    const size = 4 + Math.random()*5;
    const fromLeft = Math.random() < 0.5;
    const edgePct = fromLeft ? Math.random()*14 : 86 + Math.random()*14;
    const duration = 3.5 + Math.random()*2.5;
    el.className = 'sub-particle';
    el.style.left = edgePct + '%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = color;
    el.style.boxShadow = '0 0 8px ' + color;
    el.style.animationDuration = duration + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), duration*1000 + 150);
  };
  spawn();
  subParticleTimer = setInterval(spawn, 320);
}
function stopSubParticles() {
  if (subParticleTimer) { clearInterval(subParticleTimer); subParticleTimer = null; }
  const c = $('#subParticles'); if (c) c.innerHTML = '';
}

function updateEarnNumbers() {

let energyPopupTimer = null;
function toggleEnergyPopover() {
  const pop = document.getElementById('energyPop');
  if (!pop) return;
  if (pop.classList.contains('open')) { closeEnergyPopover(); return; }
  pop.classList.add('open');
  updateEnergyTimer();
  if (energyPopupTimer) clearInterval(energyPopupTimer);
  energyPopupTimer = setInterval(updateEnergyTimer, 1000);
}
function closeEnergyPopover() {
  const pop = document.getElementById('energyPop');
  if (pop) pop.classList.remove('open');
  if (energyPopupTimer) { clearInterval(energyPopupTimer); energyPopupTimer = null; }
}
function updateEnergyTimer() {
  const u = state.user;
  const timerEl = document.getElementById('energyTimer');
  if (!u || !timerEl) { if (energyPopupTimer) { clearInterval(energyPopupTimer); energyPopupTimer = null; } return; }
  const regen = u.regenPerSec || (u.maxEnergy / 86400);
  const lastTs = u.lastEnergyTs || Date.now();
  const elapsedSec = Math.max(0, (Date.now() - lastTs) / 1000);
  const curEnergy = Math.min(u.maxEnergy, u.energy + elapsedSec * regen);
  const remainingSec = Math.max(0, (u.maxEnergy - curEnergy) / regen);
  if (remainingSec <= 0.5) { timerEl.textContent = 'Полная ⚡'; return; }
  const h = Math.floor(remainingSec / 3600);
  const m = Math.floor((remainingSec % 3600) / 60);
  const s = Math.floor(remainingSec % 60);
  timerEl.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

let pending=0, flushTimer=null;
function bindCoin() {
  const coin=$('#coin'), wrap=$('#coinwrap');
  if (!coin) return;
  coin.onpointerdown = ev => {
    ev.preventDefault();
    const u = state.user;
    const sub = activeSub();

    if (sub) {
      // Subscription mode: a fixed pool of clicks replaces energy entirely.
      if (sub.clicksLeft<=0) { haptic('error'); toast('Клики подписки закончились'); return; }
      haptic('light');
      const scfg = subCfg(sub.id);
      u.balance += 1;
      sub.clicksLeft--;
      sub.clickCount++;
      state.local.totalTaps++;
      state.local.achievements.taps++;

      wrap.classList.remove('flash'); void wrap.offsetWidth; wrap.classList.add('flash');
      coin.classList.remove('pop'); void coin.offsetWidth; coin.classList.add('pop');
      spawnFloat(wrap, ev, '+1');

      // Every 50th click is a separate roll for a gift: 0.05% chance to win.
      if (sub.clickCount % 50 === 0 && Math.random() < 0.0005) {
        const giftValue = 1 + Math.floor(Math.random()*scfg.maxGift);
        state.local.vault.push({ name:'Подарок ⭐️'+giftValue, emoji:'⭐️' });
        toast('🎉 Подарок! ⭐️'+giftValue);
      }

      saveLocal();
      updateEarnNumbers();
      if (sub.clicksLeft<=0) {
        state.local.subscription = null;
        saveLocal();
        toast('Подписка ' + scfg.short + ' завершена');
        render(); // refresh badge / earn banner now that the pool is empty
      }
      return;
    }

    if (u.energy<=0) { haptic('error'); toast('Энергия закончилась'); return; }
    haptic('light');
    u.balance += u.tapPower;
    u.energy = Math.max(0, u.energy-1);
    state.local.totalTaps++;
    state.local.achievements.taps++;
    saveLocal();
    updateEarnNumbers();
    wrap.classList.remove('flash'); void wrap.offsetWidth; wrap.classList.add('flash');
    coin.classList.remove('pop'); void coin.offsetWidth; coin.classList.add('pop');
    spawnFloat(wrap, ev, '+'+u.tapPower);
    if (Math.random()<0.02) {
      const bonus = Math.floor(u.tapPower*(20+Math.random()*80));
      u.balance += bonus;
      state.local.vault.push({ name:'Бонус за тап', emoji:'🎁' });
      saveLocal(); toast('Бонус +'+fmt(bonus)+'!');
    }
    pending++;
    if (!flushTimer) flushTimer = setInterval(flushTaps, 700);
  };
}
function spawnFloat(wrap, ev, txt) {
  const r = wrap.getBoundingClientRect();
  const s = document.createElement('span');
  s.className='float'; s.textContent=txt;
  s.style.left=(ev.clientX-r.left)+'px'; s.style.top=(ev.clientY-r.top)+'px';
  wrap.appendChild(s); setTimeout(()=>s.remove(), 750);
}
async function flushTaps() {
  const n=pending; if (!n) return; pending=0;
  try { const r=await api('/tap',{count:n}); state.user=r.user; updateEarnNumbers(); } catch(e){}
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  try {
    if (act==='go') go(el.dataset.to);
    else if (act==='back') back();
    else if (act==='ttab') { state.tasksTab=el.dataset.v; render(); }
    else if (act==='ctab') { state.casesTab=el.dataset.v; render(); }
    else if (act==='ltab') { state.lbTab=el.dataset.v; render(); }
    else if (act==='claim') {
      if (el.dataset.link && TG) TG.openTelegramLink('https://'+el.dataset.link);
      try {
        const r = await api('/claim',{taskId:el.dataset.id});
        state.user=r.user; haptic('success'); toast('+'+fmt(r.reward)); render();
      } catch {
        state.user.balance += 50000; haptic('success'); toast('+50,000 (demo)'); render();
      }
    }
    else if (act==='boost') {
      const r = await api('/boost',{boostId:el.dataset.id});
      if (!r.ok) { haptic('error'); toast(r.error||'Мало коинов'); }
      else { state.user=r.user; haptic('success'); toast('Улучшено!'); }
      render();
    }
    else if (act==='open-case') openCase(el.dataset.id);
    else if (act==='do-upgrade') {
      const cost = 50000;
      if (state.user.balance<cost) { toast('Недостаточно коинов'); return; }
      state.user.balance -= cost;
      if (Math.random()<0.5) {
        state.user.balance += cost*2;
        haptic('success'); toast('Успех! +'+fmt(cost*2));
      } else { haptic('error'); toast('Ставка потеряна…'); }
      saveLocal(); render();
    }
    else if (act==='spin-wheel' || act==='spin-wheel-paid') {
      if (state.wheelSpinning) return;
      const paid = act==='spin-wheel-paid';
      const free = Date.now()-(state.local.wheelLast||0)>86400000;
      if (!paid && !free) return;
      if (paid && state.user.balance<100000) { toast('Нужно 100,000'); return; }
      if (paid) state.user.balance -= 100000;
      else state.local.wheelLast = Date.now();
      state.wheelSpinning = true;
      const wheel = $('#wheel');
      const extra = 1800 + Math.random()*1800;
      state.wheelAngle += extra;
      if (wheel) { wheel.classList.add('spinning'); wheel.style.transform=`rotate(${state.wheelAngle}deg)`; }
      setTimeout(()=>{
        state.wheelSpinning=false;
        const rewards = [100000,500000,50000,200000,250000,1000000,75000,300000];
        const win = rewards[Math.floor(Math.random()*rewards.length)];
        state.user.balance += win; saveLocal(); haptic('success'); toast('+'+fmt(win)+'!');
        render();
      }, 4000);
    }
    else if (act==='quiz-answer') {
      const q = QUIZ[state.quizIdx];
      const opts = document.querySelectorAll('.quiz-opt');
      opts.forEach((o,i)=>{ o.classList.add(i===q.a?'correct':'wrong'); o.disabled=true; });
      if (+el.dataset.i===q.a) state.quizScore++;
      setTimeout(()=>{ state.quizIdx++; render(); }, 800);
    }
    else if (act==='quiz-restart') { state.quizIdx=0; state.quizScore=0; render(); }
    else if (act==='sub-nav') { navSub(+el.dataset.dir); }
    else if (act==='buy-sub') {
      const id = el.dataset.id || SUBSCRIPTIONS[state.subIdx||0].id;
      const cfg = subCfg(id);
      const active = activeSub();
      if (active) {
        toast(active.id===id ? 'Подписка уже активна' : 'Сначала дождитесь окончания подписки '+subCfg(active.id).short);
        return;
      }
      if (state.user.balance<cfg.price) { toast('Нужно '+fmt(cfg.price)+' коинов'); return; }
      state.user.balance -= cfg.price;
      state.local.subscription = { id: cfg.id, clicksLeft: cfg.clicks, clickCount: 0 };
      saveLocal(); haptic('success'); toast(cfg.name+' активирован!'); render();
    }
    else if (act==='create-clan') {
      if (state.user.balance<50000000) { toast('Нужно 50,000,000'); return; }
      state.user.balance-=50000000;
      state.local.clan={name:'My Clan',logo:'🛡️',members:1,rank:99,warTaps:0};
      saveLocal(); haptic('success'); toast('Клан создан!'); render();
    }
    else if (act==='join-clan') {
      state.local.clan={name:'Alpha Tappers',logo:'⚔️',members:87,rank:3,warTaps:1250000};
      saveLocal(); haptic('success'); toast('Вы вступили в клан!'); render();
    }
    else if (act==='leave-clan') { state.local.clan=null; saveLocal(); toast('Вы покинули клан'); render(); }
    else if (act==='daily-claim') {
      const day = Math.min(7, Math.floor(state.local.totalTaps/500)+1);
      const reward = 50000+day*25000;
      state.user.balance+=reward; haptic('success'); toast('+'+fmt(reward)); render();
    }
    else if (act==='invite') {
      haptic('light');
      const link = 'https://t.me/share/url?url='+encodeURIComponent('https://t.me/giftcoin_bot?start='+(state.user.id||''))
        +'&text='+encodeURIComponent('GIFT COIN — тапай, зарабатывай, выигрывай!');
      if (TG) TG.openTelegramLink(link); else navigator.clipboard?.writeText(link); toast('Ссылка скопирована');
    }
    else if (act==='buy') { haptic('warning'); toast('Оплата скоро'); }
    else if (act==='energy-info') toggleEnergyPopover();
    else if (act==='soon') { haptic('light'); toast('Скоро'); }
    else if (act==='vault-item') toast('Приз: '+state.local.vault[+el.dataset.i]?.name);
  } catch(e) { haptic('error'); toast('Ошибка'); }
});

(async function boot() {
  tgReady();
  ensureLocal();
  try {
    state.user = await ensureAuth();
  } catch(e) {
    state.user = demoUser();
    toast('Demo режим — backend недоступен');
  }
  render();
})();
</script>
</body>
</html>
