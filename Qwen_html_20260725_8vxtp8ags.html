<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0D0D0D" />
<title>GIFT COIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--bg:#0B0D12;--c1:rgba(18,24,34,.55);--c2:rgba(255,255,255,.12);--mut:#9aa6b2;--w:#fff;--glow:rgba(255,255,255,.9)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.08), transparent 28%),
    radial-gradient(circle at 80% 0%, rgba(255,255,255,.05), transparent 24%),
    linear-gradient(180deg,#0b0d12 0%,#0e1218 46%,#090b0f 100%);height:100%}
  body{color:var(--w);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow:hidden}
  .ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
  .ic.f{fill:currentColor;stroke:none}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate}
  /* header */
  .hd{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none;position:relative;overflow:hidden}
  .hd::before,.card::before,.nav::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 28%,rgba(255,255,255,.08) 52%,rgba(255,255,255,0) 74%,rgba(255,255,255,.1));opacity:.55}
  .hd::after,.card::after,.nav::after{content:'';position:absolute;inset:1px;border-radius:inherit;pointer-events:none;border:1px solid rgba(255,255,255,.06);mix-blend-mode:screen}
  .hd .ttl{flex:1;text-align:center;font-size:13px;font-weight:600;letter-spacing:1.5px}
  .hd .side{width:30px;height:30px;display:grid;place-items:center;color:var(--mut);flex:none;position:relative;z-index:1}
  .hd .ava{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--mut);font-size:15px;backdrop-filter:blur(14px)}
  .hd .back{font-size:20px}
  /* scroll area */
  .sc{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 96px;-webkit-overflow-scrolling:touch}
  .sc::-webkit-scrollbar{width:0}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.05));backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-top:1px solid rgba(255,255,255,.12);
    box-shadow:0 -12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
    display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:20;overflow:hidden}
  .nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:9px;letter-spacing:.3px;width:18%;cursor:pointer}
  .nav button .gi{font-size:19px}
  .nav button.on{color:var(--w)}
  /* widgets */
  .card{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.12);border-radius:18px;backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.16);position:relative;overflow:hidden}
  .row{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-bottom:8px}
  .row .bx{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--mut);font-size:15px;flex:none;backdrop-filter:blur(14px)}
  .row .t{flex:1;min-width:0}
  .row .t b{font-size:12px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t small{font-size:10px;color:var(--mut)}
  .btnw{background:rgba(255,255,255,.92);color:#000;border:0;border-radius:10px;padding:6px 14px;font-size:10px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .btnd{background:rgba(255,255,255,.08);color:var(--w);border:0;border-radius:10px;padding:6px 14px;font-size:10px;font-weight:600;cursor:pointer;backdrop-filter:blur(14px)}
  .btnw:active,.btnd:active,.nav button:active,.ava:active,.back:active{transform:scale(.94)}
  .pill{font-size:10px;padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:var(--mut);cursor:pointer;backdrop-filter:blur(14px)}
  .pill.on{background:rgba(255,255,255,.94);color:#000;border-color:rgba(255,255,255,.94)}
  .bar{height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--w);transition:width .25s}
  .mut{color:var(--mut)}
  .num{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;margin:4px 0 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .two .card{padding:9px;text-align:center}
  .two small{font-size:9px;color:var(--mut);display:block;margin-bottom:2px}
  .two b{font-size:15px}
  /* coin */
  .coinwrap{position:relative;display:grid;place-items:center;margin:14px 0;user-select:none;isolation:isolate}
  .coin{width:172px;height:172px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.92);font-size:64px;
    background:radial-gradient(circle at 35% 30%,#6b6b6b 0%,#2b2b2b 45%,#0d0d0d 100%);
    border:2px solid #3a3a3a;touch-action:manipulation;cursor:pointer;position:relative;z-index:1;
    box-shadow:0 16px 44px rgba(0,0,0,.7),inset 0 3px 9px rgba(255,255,255,.28),inset 0 -11px 20px rgba(0,0,0,.7)}
  .coinwrap.flash::before{content:'';position:absolute;width:178px;height:178px;border-radius:50%;background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.36) 22%, rgba(255,255,255,.14) 44%, rgba(255,255,255,0) 72%);filter:blur(16px);opacity:0;transform:translateY(14px) scale(.86);pointer-events:none;z-index:0;animation:shadowPop .18s ease-out forwards}
  .coin.pop{animation:pop .16s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
  @keyframes shadowPop{0%{opacity:0;transform:translateY(18px) scale(.84)}35%{opacity:1;transform:translateY(10px) scale(1.02)}100%{opacity:0;transform:translateY(14px) scale(1.06)}}
  .float{position:absolute;z-index:3;font-weight:800;font-size:20px;pointer-events:none;animation:fu .8s ease-out forwards;text-shadow:0 2px 6px #000}
  @keyframes fu{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-80px) scale(1.25)}}
  .bal{text-align:center}
  .bal .v{font-size:30px;font-weight:800}
  .bal .u{font-size:10px;letter-spacing:4px;color:var(--mut)}
  .bal .pt{font-size:13px;color:var(--mut);margin-top:3px}
  .en{margin-top:14px}
  .en .top{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-bottom:6px}
  .full{width:100%;background:var(--c2);color:var(--w);border:0;border-radius:11px;padding:11px;font-size:12px;font-weight:600;margin-top:10px;cursor:pointer}
  .full.w{background:var(--w);color:#000}
  .full:active{transform:scale(.98)}
  .price{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
  .price .g{color:var(--mut);font-size:13px}
  .alloc{padding:16px;text-align:center;margin-bottom:12px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));box-shadow:0 18px 44px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.18)}
  .alloc small{font-size:10px;color:var(--mut)}
  .alloc .v{font-size:28px;font-weight:800}
  .alloc .u{font-size:10px;letter-spacing:4px;color:var(--mut)}
  .chk{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;color:var(--mut);font-size:12px;flex:none;cursor:pointer;background:rgba(255,255,255,.06);backdrop-filter:blur(12px)}
  .chk.on{background:var(--w);color:#000;border-color:var(--w)}
  .cap{font-size:10px;color:var(--mut);letter-spacing:1px;margin:6px 0 8px}
  .rk{width:18px;text-align:center;color:var(--mut);font-size:11px}
  .me{border-color:var(--w)!important}
  .menu .row{cursor:pointer}
  /* toast */
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--w);color:#000;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:80%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .load{display:grid;place-items:center;height:100%;color:var(--mut);font-size:13px;padding:30px;text-align:center}
</style>
</head>

<div id="app"><div class="load">Loading…</div></div>

<script>
/* ============================================================
   GIFT COIN — Telegram Mini App (single file, no build step)
   Deploy this file as-is to Vercel (Static / "Other" preset).
   ============================================================ */

/* >>> EDIT THIS to your backend URL on your own server <<<
   You can also override at runtime with ?api=https://... for testing. */
const API_BASE = (new URLSearchParams(location.search).get('api'))
  || (location.protocol === 'file:' ? 'http://localhost:3001' : '/api');

const TG = window.Telegram && window.Telegram.WebApp;
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => Math.floor(n).toLocaleString('en-US');
const I = id => `<svg class="ic"><use href="#${id}"/></svg>`;
const IF = id => `<svg class="ic f"><use href="#${id}"/></svg>`;
const ROOTS = ['earn', 'tasks', 'friends', 'boost', 'airdrop'];

const state = { user: null, screen: 'earn', tab: 'earn', friends: [], alloc: 0, tasksTab: 'daily', lbTab: 'Global' };

/* ---------- telegram helpers ---------- */
function tgReady() {
  if (!TG) return;
  try {
    TG.ready(); TG.expand();
    TG.setBackgroundColor && TG.setBackgroundColor('#0D0D0D');
    TG.setHeaderColor && TG.setHeaderColor('#0D0D0D');
  } catch (e) {}
}
function haptic(kind = 'light') {
  const h = TG && TG.HapticFeedback; if (!h) return;
  try { if (kind === 'success' || kind === 'error' || kind === 'warning') h.notificationOccurred(kind);
        else h.impactOccurred(kind); } catch (e) {}
}

/* ---------- api ---------- */
const TOKEN_KEY = 'gc_token';
function token() { return localStorage.getItem(TOKEN_KEY); }
async function api(path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const t = token(); if (t) headers['Authorization'] = 'Bearer ' + t;
  const res = await fetch(API_BASE + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers, body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; throw e; }
  return data;
}
async function auth() {
  const initData = (TG && TG.initData) || '';
  const r = await api('/auth', { initData });
  localStorage.setItem(TOKEN_KEY, r.token);
  return r.user;
}
async function ensureAuth() {
  if (token()) {
    try { const r = await api('/me'); return r.user; }
    catch (e) { if (e.status !== 401) throw e; }
  }
  return await auth();
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- navigation ---------- */
function go(screen) {
  if (ROOTS.includes(screen)) state.tab = screen;
  state.screen = screen;
  if (screen === 'friends') api('/friends').then(r => { state.friends = r.list; render(); }).catch(() => {});
  if (screen === 'airdrop') api('/airdrop').then(r => { state.alloc = r.allocation; render(); }).catch(() => {});
  render();
}
function back() { go(state.tab || 'earn'); }

/* ============================================================
   RENDER
   ============================================================ */
function header(title, nested) {
  const left = nested
    ? `<div class="side back" data-act="back">${I('i-back')}</div>`
    : `<div class="ava" data-act="go" data-to="profile">${I('i-user')}</div>`;
  return `<div class="hd">${left}<div class="ttl">${title}</div><div class="side"></div></div>`;
}

function nav() {
  const items = [
    ['earn', 'Earn', 'i-gift'], ['tasks', 'Tasks', 'i-clip'], ['friends', 'Friends', 'i-users'],
    ['boost', 'Boost', 'i-zap'], ['airdrop', 'Airdrop', 'i-shield'],
  ];
  return `<nav class="nav">${items.map(([id, label, ic]) =>
    `<button class="${state.screen === id ? 'on' : ''}" data-act="go" data-to="${id}">
       <span class="gi">${I(ic)}</span><span>${label}</span></button>`).join('')}</nav>`;
}

function screenEarn() {
  const u = state.user;
  const pct = Math.round((u.energy / u.maxEnergy) * 100);
  return header('EARN', false) + `<div class="sc">
    <div class="bal" style="margin-top:8px">
      <div class="v num" id="bal">${fmt(u.balance)}</div>
      <div class="u">GIFT</div>
      <div class="pt">+${u.tapPower} per tap</div>
    </div>
    <div class="coinwrap" id="coinwrap">
      <div class="coin" id="coin">${I('i-gift')}</div>
    </div>
    <div class="card en" style="padding:11px 13px">
      <div class="top"><span>${I('i-zap')} Energy</span><span class="num" id="entxt">${fmt(u.energy)} / ${fmt(u.maxEnergy)}</span></div>
      <div class="bar"><i id="enbar" style="width:${pct}%"></i></div>
    </div>
  </div>`;
}

function screenTasks() {
  const u = state.user;
  const today = new Date().toDateString();
  const list = TASKS.filter(t => state.tasksTab === 'daily' ? t.kind === 'daily' : t.kind === 'once');
  const right = t => {
    const claimed = t.kind === 'once' && u.tasksClaimed.includes(t.id);
    const dailyDone = t.kind === 'daily' && new Date(u.lastLoginTs).toDateString() === today;
    if (claimed || dailyDone) return `<span style="color:#fff">${I('i-check')}</span>`;
    if (t.action === 'claim') return `<button class="btnw" data-act="claim" data-id="${t.id}">Claim</button>`;
    if (t.action === 'link') return `<button class="btnw" data-act="claim" data-id="${t.id}" data-link="${t.meta}">Claim</button>`;
    if (t.action === 'video') return `<button class="btnd" data-act="claim" data-id="${t.id}">Start</button>`;
    return `<span class="mut" style="font-size:11px">${t.meta}</span>`;
  };
  const icon = t => t.action === 'video' ? I('i-video') : t.action === 'invite' ? I('i-userplus')
    : t.id.includes('x') ? IF('i-x') : t.id.includes('tg') ? IF('i-tg') : I('i-clip');
  return header('TASKS', false) + `<div class="sc">
    <div class="tabs">
      <span class="pill ${state.tasksTab === 'daily' ? 'on' : ''}" data-act="ttab" data-v="daily">Daily</span>
      <span class="pill ${state.tasksTab === 'once' ? 'on' : ''}" data-act="ttab" data-v="once">Weekly</span>
      <span class="pill">Achievements</span>
    </div>
    ${list.map(t => `<div class="card row"><div class="bx">${icon(t)}</div>
      <div class="t"><b>${t.title}</b><small>+${fmt(t.reward)}</small></div>${right(t)}</div>`).join('')}
  </div>`;
}

function screenFriends() {
  const u = state.user;
  const earned = u.friendsEarned || state.friends.length * 100000;
  return header('FRIENDS', false) + `<div class="sc">
    <div class="two">
      <div class="card"><small>Total Friends</small><b>${u.friendsCount}</b></div>
      <div class="card"><small>Total Earned</small><b class="num">${fmt(earned)}</b></div>
    </div>
    <button class="full w" data-act="invite">Invite a friend</button>
    ${state.friends.length === 0
      ? `<div class="mut" style="text-align:center;margin-top:30px;font-size:13px">No friends yet.<br>Invite and earn together!</div>`

          <div class="t"><b>${f.name}</b></div><small class="mut">+${fmt(f.reward)}</small></div>`).join('')}
  </div>`;
}

function screenBoost() {

    ${BOOSTS.map(b => {
      const lvl = u.boosts[b.id] || 0, cost = boostCost(b, lvl), dis = u.balance < cost;
      return `<div class="card row"><div class="bx">${I(ico[b.icon])}</div>
        <div class="t"><b>${b.name}</b><small>${b.desc}${lvl ? ' · lv ' + lvl : ''}</small></div>
        <button class="price" data-act="boost" data-id="${b.id}" ${dis ? 'style="opacity:.4"' : ''}>
          <span class="g">${I('i-gift')}</span>${fmt(cost)}</button></div>`;
    }).join('')}

}

function screenAirdrop() {
  const u = state.user;
  const ico = { wallet: 'i-wallet', x: 'i-x', tg: 'i-tg', users: 'i-users' };
  return header('AIRDROP', false) + `<div class="sc">
    <div class="card alloc"><small>Your allocation</small><div class="v num">${fmt(state.alloc)}</div><div class="u">GIFT</div></div>
    <div class="cap">Tasks to increase allocation</div>

      const done = u.airdropDone.includes(t.id);

function screenProfile() {

  const menu = [
    ['i-store', 'Shop', 'shop'], ['i-trophy', 'Leaderboard', 'leaderboard'],

  ];
  return header('PROFILE', true) + `<div class="sc">
    <div class="card row"><div class="bx" style="width:46px;height:46px;border-radius:50%;font-size:20px">${I('i-user')}</div>
      <div class="t"><b>${u.username ? '@' + u.username : '@player'}</b><small>Level ${u.level} · ${u.rank}</small></div></div>
    <div class="bar" style="margin:0 2px 12px"><i style="width:${pct}%"></i></div>
    <div class="card" style="padding:14px;text-align:center;margin-bottom:12px">
      <div class="mut" style="font-size:10px">Total Balance</div>
      <div class="num" style="font-size:24px;font-weight:800">${fmt(u.balance)}</div>
      <div class="mut" style="font-size:10px;letter-spacing:3px">GIFT</div>
    </div>
    <div class="menu">${menu.map(([ic, t, to]) => `<div class="card row" ${to ? `data-act="go" data-to="${to}"` : `data-act="soon"`}>

function screenShop() {
  return header('SHOP', true) + `<div class="sc" style="padding-top:6px">
    ${SHOP.map(p => `<div class="card row"><div class="bx">${I('i-gift')}</div>
      <div class="t"><b>${p.name}</b><small>${fmt(p.amount)} GIFT</small></div>
      <button class="btnw" data-act="buy" data-id="${p.id}">${p.price}</button></div>`).join('')}
    <div class="mut" style="font-size:10px;text-align:center;margin-top:16px">Payments via Telegram Stars / TON — coming soon.</div>
  </div>`;
}

function screenLeaderboard() {
  return header('LEADERBOARD', true) + `<div class="sc">
    <div class="tabs">${['Global', 'Friends', 'Country'].map(t =>
      `<span class="pill ${state.lbTab === t ? 'on' : ''}" data-act="ltab" data-v="${t}">${t}</span>`).join('')}</div>
    <div id="lbrows"><div class="mut" style="text-align:center;padding:20px">…</div></div>
  </div>`;
}

function render() {
  if (!state.user) { $('#app').innerHTML = `<div class="load">Loading…</div>`; return; }
  const map = { earn: screenEarn, tasks: screenTasks, friends: screenFriends, boost: screenBoost,
    airdrop: screenAirdrop, profile: screenProfile, shop: screenShop, leaderboard: screenLeaderboard };
  $('#app').innerHTML = (map[state.screen] || screenEarn)() + nav();
  if (state.screen === 'earn') bindCoin();
  if (state.screen === 'leaderboard') loadLeaderboard();
}

/* optimistic earn numbers (no full re-render → keeps float anims alive) */
function updateEarnNumbers() {
  const u = state.user; if (!u) return;
  const b = $('#bal'), e = $('#entxt'), bar = $('#enbar');
  if (b) b.textContent = fmt(u.balance);
  if (e) e.textContent = fmt(u.energy) + ' / ' + fmt(u.maxEnergy);
  if (bar) bar.style.width = Math.round((u.energy / u.maxEnergy) * 100) + '%';
}

/* ---------- tap handling with batching ---------- */
let pending = 0, flushTimer = null;
function bindCoin() {
  const coin = $('#coin'), wrap = $('#coinwrap');
  if (!coin) return;
  coin.onpointerdown = (ev) => {
    ev.preventDefault();
    const u = state.user;
    if (u.energy <= 0) { haptic('error'); toast('No energy left'); return; }
    haptic('light');
    u.balance += u.tapPower; u.energy = Math.max(0, u.energy - 1);
    updateEarnNumbers();
    wrap.classList.remove('flash');
    void wrap.offsetWidth;
    wrap.classList.add('flash');
    clearTimeout(wrap._flashT);
    wrap._flashT = setTimeout(() => wrap.classList.remove('flash'), 180);
    coin.classList.remove('pop'); void coin.offsetWidth; coin.classList.add('pop');
    spawnFloat(wrap, ev, '+' + u.tapPower);
    pending++; if (!flushTimer) flushTimer = setInterval(flushTaps, 700);
  };
}
function spawnFloat(wrap, ev, txt) {
  const r = wrap.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'float'; s.textContent = txt;
  s.style.left = (ev.clientX - r.left) + 'px'; s.style.top = (ev.clientY - r.top) + 'px';
  wrap.appendChild(s); setTimeout(() => s.remove(), 800);
}
async function flushTaps() {
  const n = pending; if (!n) return; pending = 0;
  try { const r = await api('/tap', { count: n }); state.user = r.user; updateEarnNumbers(); }
  catch (e) { /* server will reconcile on next action */ }
}

async function loadLeaderboard() {
  try {
    const r = await api('/leaderboard');
    const box = $('#lbrows'); if (!box) return;
    box.innerHTML = r.rows.map(row => `<div class="card row ${row.me ? 'me' : ''}">
      <span class="rk">${row.rank}</span><div class="bx">${row.rank}</div>
      <div class="t"><b>${row.name}</b></div><b class="num">${row.score}</b></div>`).join('');
  } catch (e) {}
}

/* ============================================================
   GLOBAL EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  try {
    if (act === 'go') go(el.dataset.to);
    else if (act === 'back') back();
    else if (act === 'ttab') { state.tasksTab = el.dataset.v; render(); }
    else if (act === 'ltab') { state.lbTab = el.dataset.v; render(); }
    else if (act === 'claim') {
      if (el.dataset.link && TG) TG.openTelegramLink(el.dataset.link);
      const r = await api('/claim', { taskId: el.dataset.id });
      state.user = r.user; haptic('success'); toast('+' + fmt(r.reward)); render();
    }
    else if (act === 'boost') {
      const r = await api('/boost', { boostId: el.dataset.id });
      if (!r.ok) { haptic('error'); toast(r.error || 'Not enough coins'); }
      else { state.user = r.user; haptic('success'); toast('Boosted!'); }
      render();
    }
    else if (act === 'airdrop') {
      const r = await api('/airdrop', { taskId: el.dataset.id });
      state.user = r.user; state.alloc = r.allocation; haptic('success'); render();
    }
    else if (act === 'aircheck') { haptic('light'); toast('Allocation: ' + fmt(state.alloc)); }
    else if (act === 'invite') {
      haptic('light');
      const link = 'https://t.me/share/url?url=' + encodeURIComponent('https://t.me/your_bot?start=' + (state.user.id || ''))
        + '&text=' + encodeURIComponent('Join GIFT COIN! Play. Earn. Own.');
      if (TG) TG.openTelegramLink(link); else window.open(link);
    }
    else if (act === 'buy') { haptic('warning'); toast('Payments coming soon'); }
    else if (act === 'soon') { haptic('light'); toast('Coming soon'); }
  } catch (e) { haptic('error'); toast('Server error'); }
});

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  tgReady();
  try {
    state.user = await ensureAuth();
    state.alloc = 10000;
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="load">Couldn't connect to server.<br><br>
      Check the API proxy/backend and that it is online.<br><br>
      <span class="mut" style="font-size:11px">${(e && e.message) || e}</span></div>`;
  }
})();
</script>
